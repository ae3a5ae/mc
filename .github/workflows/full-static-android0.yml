name: android-arm64-static0

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      ANDROID_API: 24
      ANDROID_NDK_VERSION: 27.2.12479018
      TARGET: aarch64-linux-android
      PREFIX: ${{ github.workspace }}/android-deps
      BUILD_TRIPLET: x86_64-pc-linux-gnu

    steps:
      # --------------------------------------------------
      # Checkout and host tools
      # --------------------------------------------------

      - uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            python3-pip \
            ninja-build \
            python3 \
            curl \
            xz-utils \
            bzip2 \
            file

      # --------------------------------------------------
      # Android NDK
      # --------------------------------------------------

      - name: Get libiconv
        run: |
          curl -m 10 -fL https://ftp.gnu.org/gnu/libiconv/libiconv-1.18.tar.gz -o libiconv.tar.gz

          tar -xzf libiconv.tar.gz


      - name: Install Android NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Configure cross-compilation environment
      # --------------------------------------------------

      - name: Configure Android toolchain
        run: |
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "CC=$TOOLCHAIN/${TARGET}${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/${TARGET}${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"

          echo "CFLAGS=-O2 -fPIC" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O2 -fPIC" >> "$GITHUB_ENV"

          mkdir -p "$PREFIX"

          "$TOOLCHAIN/${TARGET}${ANDROID_API}-clang" --version

      # --------------------------------------------------
      # Cross pkg-config wrapper
      # --------------------------------------------------

      - name: Configure cross pkg-config
        run: |
          mkdir -p "$PREFIX/bin"

          cat > "$PREFIX/bin/aarch64-pkg-config" <<'EOF'
          #!/bin/sh
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          unset PKG_CONFIG_PATH
          exec /usr/bin/pkg-config "$@"
          EOF

          chmod +x "$PREFIX/bin/aarch64-pkg-config"

          echo "PKG_CONFIG=$PREFIX/bin/aarch64-pkg-config" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Build libffi
      # --------------------------------------------------

      - name: Build libffi
        run: |
          curl -fL https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz -o libffi.tar.gz
          tar -xzf libffi.tar.gz
          cd libffi-3.4.8

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="$CFLAGS" \
          ./configure \
            --host="$TARGET" \
            --build="$BUILD_TRIPLET" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --with-pic

          make -j"$(nproc)"
          make install

      # --------------------------------------------------
      # Build PCRE2
      # --------------------------------------------------

      - name: Build PCRE2
        run: |
          curl -fL \
            https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz \
            -o pcre2.tar.gz

          tar -xzf pcre2.tar.gz
          cd pcre2-10.45

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="$CFLAGS" \
          ./configure \
            --host="$TARGET" \
            --build="$BUILD_TRIPLET" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-pcre2-16 \
            --disable-pcre2-32 \
            --disable-jit

          make -j"$(nproc)"
          make install

      - name: Build libiconv
        run: |
          cd libiconv-1.18

          ./configure \
            --host="$TARGET" \
            --build="$BUILD_TRIPLET" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --with-pic \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

            make -j"$(nproc)"
            make install

            echo "Checking libiconv installation:"
            ls -l "$PREFIX/include/iconv.h"
            ls -l "$PREFIX/lib/libiconv.a"

      # --------------------------------------------------
      # Build ncurses
      # --------------------------------------------------

      - name: Build ncurses
        run: |
          curl -fL https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz -o ncurses.tar.gz
          tar -xzf ncurses.tar.gz
          cd ncurses-6.5

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="$CFLAGS" \
          ./configure \
            --host="$TARGET" \
            --build="$BUILD_TRIPLET" \
            --prefix="$PREFIX" \
            --with-shared=no \
            --with-normal \
            --without-debug \
            --without-ada \
            --without-cxx \
            --without-cxx-binding \
            --without-progs \
            --without-manpages \
            --enable-widec \
            --enable-pc-files \
            --with-pkg-config-libdir="$PREFIX/lib/pkgconfig" \
            --with-fallbacks=xterm-256color,xterm

          make -j"$(nproc)"
          make install

      # --------------------------------------------------
      # Build GLib using Meson
      # --------------------------------------------------

      - name: Prepare Android cross file
        run: |
          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$PKG_CONFIG'

          [built-in options]
          c_args = ['-I$PREFIX/include']
          cpp_args = ['-I$PREFIX/include']
          c_link_args = ['-L$PREFIX/lib']
          cpp_link_args = ['-L$PREFIX/lib']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          echo "Generated Android cross file:"
          cat android-aarch64.ini

          rm -rf glib-build

      - name: Install Meson
        run: |
          python3 -m pip install --user "meson==1.4.2"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          meson --version

      - name: Build GLib
        run: |
          curl -fL \
            https://download.gnome.org/sources/glib/2.84/glib-2.84.4.tar.xz \
            -o glib.tar.xz

          tar -xJf glib.tar.xz

          export CFLAGS="$CFLAGS -I$PREFIX/include"
          export CXXFLAGS="$CXXFLAGS -I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          meson setup glib-build glib-2.84.4 \
            --cross-file android-aarch64.ini \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            -Ddefault_library=static \
            -Dtests=false \
            -Dinstalled_tests=false \
            -Dintrospection=disabled \
            -Dman-pages=disabled \
            -Ddocumentation=false \
            -Dlibmount=disabled \
            -Dselinux=disabled \
            -Dxattr=false

          meson compile -C glib-build -j"$(nproc)"
          meson install -C glib-build

      - name: Show GLib Meson logs on failure
        if: failure()
        run: |
          echo "========== MESON LOGS =========="

          if [ -d glib-build/meson-logs ]; then
            for log in glib-build/meson-logs/*.txt; do
              [ -f "$log" ] || continue

              echo ""
              echo "========== $log =========="
              cat "$log"
            done
          else
            echo "Meson log directory does not exist."
          fi

      # --------------------------------------------------
      # Verify dependency installation
      # --------------------------------------------------

      - name: Verify Android dependencies
        run: |
          echo "Installed static libraries:"
          find "$PREFIX/lib" -maxdepth 1 -name '*.a' -print

          echo "GLib:"
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion glib-2.0

          echo "ncurses:"
          find "$PREFIX/lib" -name '*ncurses*.a' -print

          echo "PCRE2:"
          find "$PREFIX/lib" -name '*pcre2*.a' -print

          echo "libffi:"
          find "$PREFIX/lib" -name 'libffi*.a' -print

      # --------------------------------------------------
      # Bootstrap Midnight Commander
      # --------------------------------------------------

      - name: Bootstrap Midnight Commander
        run: |
          ./autogen.sh

      - name: Diagnose GLib installation
        run: |
          echo "===== GLib headers ====="
          ls -la "$PREFIX/include/glib-2.0/glib.h"

          echo "===== GLib libraries ====="
          find "$PREFIX/lib" -maxdepth 1 -name '*.a' -print

          echo "===== GLib pkg-config files ====="
          find "$PREFIX" -name 'glib-2.0.pc' -o -name 'gobject-2.0.pc'

          echo "===== pkg-config GLib ====="
          "$PKG_CONFIG" --modversion glib-2.0 || true
          "$PKG_CONFIG" --static --libs glib-2.0 || true

      - name: Diagnose GLib pkg-config
        run: |
          echo "===== PKG_CONFIG ====="
          cat "$PKG_CONFIG"

          echo "===== GLib pkg-config files ====="
          find "$PREFIX" -name '*.pc' -print

          echo "===== GLib installation ====="
          ls -l "$PREFIX/include/glib-2.0/glib.h"
          ls -l "$PREFIX/lib"/libglib-2.0.a

          echo "===== GLib version ====="
          "$PKG_CONFIG" --modversion glib-2.0

          echo "===== GLib compile flags ====="
          "$PKG_CONFIG" --cflags glib-2.0

          echo "===== GLib static link flags ====="
          "$PKG_CONFIG" --static --libs glib-2.0

      - name: Test static GLib linking
        run: |
          cat > glib-test.c <<'EOF'
          #include <glib.h>

          int main(void)
          {
              gpointer p = g_malloc(16);
              g_free(p);
              return 0;
          }
          EOF

          echo "===== Compiling and linking GLib test ====="

          "$CC" \
            $CFLAGS \
            $CPPFLAGS \
            $("$PKG_CONFIG" --cflags glib-2.0) \
            glib-test.c \
            $LDFLAGS \
            $("$PKG_CONFIG" --static --libs glib-2.0) \
            -o glib-test

          echo "===== Result ====="
          file glib-test

      - name: Show MC configure errors
        if: failure()
        run: |
          echo "===== GLib-related configure errors ====="

          if [ -f build-android/config.log ]; then
            grep -in -B15 -A35 \
              -E 'glib|cannot find|undefined reference|error:' \
              build-android/config.log | tail -250
          fi

      # --------------------------------------------------
      # Build Midnight Commander
      # --------------------------------------------------

      - name: Build Midnight Commander
        run: |
          mkdir -p build-android
          cd build-android

          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"
          export GLIB_LIBDIR="$PREFIX/lib"

          export NCURSES_CFLAGS="$("$PKG_CONFIG" --cflags ncursesw)"
          export NCURSES_LIBS="$("$PKG_CONFIG" --libs ncursesw)"

          echo "===== GLib static library checks ====="
          test -f "$GLIB_LIBDIR/libglib-2.0.a"
          test -f "$GLIB_LIBDIR/libgmodule-2.0.a"

          echo "GLIB_LIBDIR=$GLIB_LIBDIR"
          echo "===== Configure static GLib logic ====="

          grep -n -C 5 'GLIB_LIBDIR' ../configure || true
          grep -n -C 5 'GLIB_LIBDIR' ../configure.ac || true

          echo "===== NCURSES HEADERS ====="
          find "$PREFIX/include" -type f \
            \( -name 'curses.h' -o -name 'ncurses.h' -o -name 'term.h' \)

          echo "===== NCURSES PKG-CONFIG ====="
          "$PKG_CONFIG" --modversion ncursesw
          "$PKG_CONFIG" --cflags ncursesw
          "$PKG_CONFIG" --libs ncursesw

          echo "===== HEADER TEST ====="
          for h in ncursesw/ncurses.h ncursesw/curses.h ncurses.h curses.h; do
              printf '#include <%s>\nint main(void) { return 0; }\n' "$h" > ncurses-test.c
              if "$CC" $CFLAGS $CPPFLAGS ncurses-test.c -o ncurses-test; then
                  echo "FOUND: $h"
              else
                  echo "NOT FOUND: $h"
              fi
          done

          echo "===== TEST nl_langinfo ====="

          cat > langinfo-test.c <<'EOF'
          #include <langinfo.h>
          #include <stdio.h>

          int main(void)
          {
              const char *encoding = nl_langinfo(CODESET);
              printf("Encoding: %s\n", encoding);
              return 0;
          }
          EOF

          echo "===== ANDROID LANGINFO HEADER ====="

          sed -n '1,180p' \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/langinfo.h"

          echo "===== NDK nl_langinfo DECLARATION ====="

          grep -n -B 12 -A 12 'nl_langinfo' \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/langinfo.h"

          echo "===== FEATURE MACROS ====="

          "$CC" -dM -E -x c /dev/null | grep -E '_POSIX|_GNU_SOURCE|__ANDROID_API__'

          ../configure \
            --host="$TARGET" \
            --build="$BUILD_TRIPLET" \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PKG_CONFIG="$PKG_CONFIG" \
            GLIB_CFLAGS="$("$PKG_CONFIG" --cflags glib-2.0)" \
            GLIB_LIBS="$("$PKG_CONFIG" --libs glib-2.0)" \
            --prefix=/data/local/tmp/mc \
            --with-screen=ncurses \
            --with-ncurses-libdir="$PREFIX/lib" \
            --with-ncurses-includedir="$PREFIX/include" \
            --with-glib-static \
            --disable-nls \
            --disable-aspell \
            --without-gpm-mouse \
            --without-x \
            --without-subshell \
            --disable-shared \
            --enable-static \
            --disable-werror

          make -j"$(nproc)" || true

      #    mkdir -p "$GITHUB_WORKSPACE/stage"

      #    make DESTDIR="$GITHUB_WORKSPACE/stage" install

      #    "$STRIP" --strip-unneeded \
      #      "$GITHUB_WORKSPACE/stage/data/local/tmp/mc/bin/mc"

      - name: Inspect GLib and MC archives
        run: |
          echo "===== GLib archive type ====="
          file android-deps/lib/libglib-2.0.a

          echo "===== GLib archive members ====="
          llvm-ar t android-deps/lib/libglib-2.0.a | head -20

          echo "===== MC archive GLib members ====="
          llvm-ar t build-android/lib/.libs/libmc.a | grep -i glib || true

          echo "===== MC archive first members ====="
          llvm-ar t build-android/lib/.libs/libmc.a | head -30

      # --------------------------------------------------
      # Verify binary
      # --------------------------------------------------

      - name: Verify Android binary
        run: |
          MC="$GITHUB_WORKSPACE/stage/data/local/tmp/mc/bin/mc"

          file "$MC"

          "$TOOLCHAIN/llvm-readelf" -h "$MC"

          echo "Dynamic dependencies:"
          "$TOOLCHAIN/llvm-readelf" -d "$MC" || true

          if "$TOOLCHAIN/llvm-readelf" -d "$MC" 2>/dev/null \
            | grep -E 'lib(glib|ncurses|pcre2|ffi)' ; then
            echo "ERROR: A third-party library is dynamically linked!"
            exit 1
          fi

          echo "Android ARM64 binary verification completed."

      # --------------------------------------------------
      # Package artifact
      # --------------------------------------------------

      - name: Pack artifacts
        run: |
          tar -czf mc-android-arm64.tar.gz \
            -C stage/data/local/tmp/mc .

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-android-arm64
          path: mc-android-arm64.tar.gz
          if-no-files-found: error
